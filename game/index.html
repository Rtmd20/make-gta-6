<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VERDE CAY — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101c; font-family: Arial, Helvetica, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f5f0e6; display: none; }
  .panel { position: absolute; background: rgba(10, 10, 16, 0.72); border: 1px solid rgba(255, 210, 122, 0.35); border-radius: 10px; padding: 10px 14px; box-shadow: 0 2px 14px rgba(0,0,0,0.45); }
  .mission { top: 16px; left: 16px; min-width: 300px; }
  .m-job { font-size: 12px; letter-spacing: 2px; color: #ffb347; font-weight: bold; }
  .m-title { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
  .m-stage { font-size: 12px; color: #c9c2b4; margin-top: 2px; }
  .m-obj { font-size: 14px; margin-top: 4px; }
  .m-timer { font-size: 13px; color: #7df0ff; margin-top: 4px; }
  .wanted { top: 16px; right: 16px; text-align: right; min-width: 150px; }
  .stars { font-size: 22px; letter-spacing: 2px; line-height: 1; }
  .star { color: #5a5348; }
  .star.lit { color: #ffd24a; text-shadow: 0 0 8px #ff9d2e; }
  .money { font-size: 22px; font-weight: 900; color: #7dff8a; margin-top: 2px; }
  .clock { font-size: 13px; color: #c9c2b4; }
  .dispatch { top: 118px; right: 16px; width: 258px; }
  .d-head { font-size: 12px; letter-spacing: 2px; color: #ff8a7a; font-weight: bold; margin-bottom: 5px; }
  .d-row { display: flex; justify-content: space-between; font-size: 13px; padding: 1px 0; }
  .d-dist { color: #c9c2b4; }
  .d-tactic { color: #ffb347; font-weight: bold; }
  .d-tactic.quiet { color: #7dff8a; }
  .bars { bottom: 16px; left: 16px; width: 300px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .bar-label { font-size: 11px; letter-spacing: 1px; width: 62px; }
  .bar-track { flex: 1; height: 9px; background: rgba(255,255,255,0.16); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; }
  .bar-fill.health { background: #34c759; }
  .bar-fill.armour { background: #5aa9ff; }
  .bar-fill.respect { background: #ff7ad9; }
  .dialogue { font-size: 13px; font-style: italic; color: #ffe9a8; margin-top: 8px; line-height: 1.35; }
  .speed { bottom: 16px; right: 252px; text-align: right; min-width: 210px; }
  .speed-num { font-size: 44px; font-weight: 900; line-height: 0.95; display: inline; }
  .speed-unit { font-size: 14px; color: #c9c2b4; display: inline; }
  .car-name { font-size: 14px; color: #ffb347; font-weight: bold; letter-spacing: 1px; }
  .condition { font-size: 12px; color: #c9c2b4; }
  .weapons { margin-top: 6px; display: flex; gap: 6px; justify-content: flex-end; }
  .weapon { font-size: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; padding: 4px 7px; white-space: pre-line; color: #c9c2b4; }
  .weapon.active { border-color: #ffd24a; color: #ffd24a; background: rgba(255,210,74,0.12); }
  .radio { font-size: 12px; color: #7df0ff; margin-top: 6px; }
  .minimap { bottom: 16px; right: 16px; width: 220px; height: 220px; border-radius: 50%; padding: 0; overflow: hidden; border: 2px solid rgba(255,210,122,0.55); }
  .minimap canvas { display: block; width: 220px; height: 220px; }
  .prompt { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); background: rgba(10,10,16,0.8); border: 1px solid rgba(255,210,122,0.5); border-radius: 8px; padding: 9px 18px; font-size: 15px; font-weight: bold; letter-spacing: 1px; opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
  .toast { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #ffd24a; text-shadow: 0 2px 10px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s; white-space: nowrap; }

  /* ---------- Full map ---------- */
  .mapscreen { position: fixed; inset: 0; background: rgba(8, 8, 12, 0.94); display: none; flex-direction: column; align-items: center; justify-content: center; color: #f5f0e6; z-index: 5; }
  .map-title { font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #ffb347; margin-bottom: 14px; }
  .map-body { display: flex; gap: 36px; align-items: flex-start; }
  .big-map { border: 2px solid rgba(255,210,122,0.5); border-radius: 8px; }
  .map-stats { font-size: 16px; line-height: 1.9; min-width: 300px; }
  .ms-key { color: #ffb347; font-weight: bold; }
  .ms-crew { color: #c9c2b4; line-height: 1.6; }
  .map-foot { margin-top: 16px; font-size: 13px; letter-spacing: 2px; color: #c9c2b4; }

  /* ---------- Title screen ---------- */
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; background: linear-gradient(180deg, rgba(20,10,30,0.25) 0%, rgba(20,10,30,0.05) 45%, rgba(20,10,30,0.55) 100%); z-index: 4; pointer-events: none; }
  #title h1 { margin: 0; font-size: 110px; line-height: 0.9; font-weight: 900; letter-spacing: 6px; text-shadow: 0 4px 0 #e8622c, 0 10px 30px rgba(0,0,0,0.7); }
  #title h1 .cay { color: #ffb347; }
  #title .tag { font-size: 20px; letter-spacing: 8px; color: #ffe9a8; margin-top: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #title-sub { max-width: 640px; font-size: 16px; line-height: 1.5; color: #f5f0e6; margin-top: 18px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  #title .controls { margin-top: 22px; font-size: 14px; line-height: 1.9; color: #e8e0d0; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  #title .controls b { color: #ffb347; }
  #start-btn { pointer-events: auto; margin-top: 26px; font-size: 20px; font-weight: 900; letter-spacing: 3px; color: #1a1206; background: #ffb347; border: none; border-radius: 8px; padding: 14px 34px; cursor: pointer; box-shadow: 0 4px 24px rgba(255, 179, 71, 0.5); }
  #start-btn:hover { background: #ffc95e; }
  #title .hint { margin-top: 14px; font-size: 12px; letter-spacing: 2px; color: #c9c2b4; }
</style>
</head>
<body>
<canvas id="game" aria-label="Verde Cay: an open-world crime game"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<div id="title">
  <h1>VERDE<br><span class="cay">CAY</span></h1>
  <div class="tag">AN OPEN-WORLD CRIME STORY</div>
  <div id="title-sub"></div>
  <div class="controls">
    <b>W A S D</b> move / drive &nbsp;·&nbsp; <b>E</b> enter / exit vehicle &nbsp;·&nbsp; <b>F</b> fire<br>
    <b>SPACE</b> brake &nbsp;·&nbsp; <b>SHIFT</b> run &nbsp;·&nbsp; <b>1 2 3</b> weapons &nbsp;·&nbsp; <b>Q</b> radio<br>
    <b>M</b> map &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>ENTER</b> start
  </div>
  <button id="start-btn">PRESS ENTER TO PLAY</button>
  <div class="hint">EIGHT JOBS · ONE CREW · THE WHOLE CITY IS YOURS</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
